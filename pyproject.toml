[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-mst-autojudge"
version = "1.0.0"
description = "Corroborate: a pooled-corroboration AutoJudge with leave-one-team-out weighting (TREC 2026 AutoJudge, team IRIS-MST)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "team IRIS-MST"}
]
keywords = ["trec", "autojudge", "rag", "evaluation", "ir", "nuggets", "pooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately light. encoders.py imports sentence-transformers and
# transformers lazily inside the model loaders, so the package imports and the
# unit tests run with numpy alone. Keeping the heavy stack in an extra stops CI
# pulling a multi-gigabyte CUDA torch build just to run tests.
dependencies = [
    "autojudge-base>=1.0.0",
    "tira>=0.0.100",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
minima-llm = [
    "minima-llm>=0.2.5",
]
encoders = [
    "sentence-transformers>=3.0",
    "transformers>=4.40",
]
evaluate = [
    "autojudge-evaluate>=1.0.0",
]
all = [
    "iris-mst-autojudge[minima-llm,evaluate,test,encoders]",
    "tqdm>=4.0",
]

[project.urls]
Homepage = "https://github.com/utshabkg/github.com-utshabkg-autojudge"
Repository = "https://github.com/utshabkg/github.com-utshabkg-autojudge"

[tool.setuptools.packages.find]
where = ["."]
include = ["judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
