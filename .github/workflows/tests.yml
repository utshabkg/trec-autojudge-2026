name: Tests

on:
  push: {}
  workflow_dispatch: {}
  pull_request: {}

# The encoder weights the judge needs. tests/test_empty_reports.py and
# tests/test_endpoint_contract.py actually execute the judge, so the weights have
# to be reachable here even though the unit tests themselves use a stub encoder.
# bge-reranker-v2-m3 is left out: it is only used by the `multilingual` variant
# and it is 2.2 GB, which is not worth paying for on every push.
env:
  HF_HOME: ${{ github.workspace }}/.hf
  MODELS: BAAI/bge-base-en-v1.5 cross-encoder/nli-deberta-v3-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest version pyproject.toml supports, and 3.12 is what the
        # container runs, which is what actually executes on TIRA. The starter kit
        # tested every version from 3.10 to 3.14 because the framework supports
        # them all, but for a judge that ships in a 3.12 image the extra three cost
        # disk and inbox without covering anything the submission depends on.
        python-version: ["3.10", "3.12"]
    steps:
      # Without this, runners intermittently died with "No space left on device"
      # straight after installing dependencies, before any test ran: torch,
      # transformers and the encoder weights, once per matrix entry, do not always
      # fit beside the runner's preinstalled toolchains. Free space varies between
      # runners, which is why it failed on some versions and some commits and not
      # others, including a documentation-only commit.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # CPU torch explicitly. Resolving `torch` from PyPI pulls a CUDA build
      # with several GB of nvidia-* wheels that a CI runner cannot use.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'

      - name: Cache encoder weights
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Fetch encoder weights
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          for repo in os.environ["MODELS"].split():
              print("fetching", repo, flush=True)
              snapshot_download(repo)
          PY

      - name: Run tests
        run: python -m pytest tests -q
