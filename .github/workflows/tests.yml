name: Tests

on:
  push: {}
  workflow_dispatch: {}
  pull_request: {}

# The encoder weights the judge needs. tests/test_empty_reports.py and
# tests/test_endpoint_contract.py actually execute the judge, so the weights have
# to be reachable here even though the unit tests themselves use a stub encoder.
# bge-reranker-v2-m3 is left out: it is only used by the `multilingual` variant
# and it is 2.2 GB, which is not worth paying for on every push.
env:
  HF_HOME: ${{ github.workspace }}/.hf
  MODELS: BAAI/bge-base-en-v1.5 cross-encoder/nli-deberta-v3-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # CPU torch explicitly. Resolving `torch` from PyPI pulls a CUDA build
      # with several GB of nvidia-* wheels that a CI runner cannot use.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'

      - name: Cache encoder weights
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Fetch encoder weights
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          for repo in os.environ["MODELS"].split():
              print("fetching", repo, flush=True)
              snapshot_download(repo)
          PY

      - name: Run tests
        run: python -m pytest tests -q
