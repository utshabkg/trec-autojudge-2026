# TIRA code submission, run from CI.
#
# Why CI and not a laptop: the cluster this judge is developed on has no
# container runtime at all (no docker, no podman, no buildah) and no root, so
# rootless podman cannot be configured. A GitHub runner has Docker, so the image
# is built and submitted from here instead.
#
# This is easy for us only because the judge declares `uses_llm: false`. The
# local kiddie test that tira-cli runs inside the submission therefore needs no
# network and no LLM endpoint, so there is no --allow-network, no cache
# determinism proof, and no prompt cache to ship.
#
# Run it with dry_run: true first. That builds the image, runs it on kiddie, and
# uploads nothing. Only when that is green, run again with dry_run: false, which
# drops both --dry-run and --dataset so the judge runs on every dataset.
name: TIRA code submission

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test locally, upload nothing"
        type: boolean
        default: true
      judge:
        description: "Judge directory under judges/"
        type: string
        default: "corroborate"
      variant:
        description: "workflow.yml variant to submit"
        type: string
        default: "best"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The image carries about 3 GB of encoder weights on top of the base
      # image, which does not fit beside the runner's preinstalled toolchains.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tira reads git metadata for provenance

      # tira-cli submits the committed state of the current branch and refuses a
      # dirty tree, so fail early and loudly rather than submitting a surprise.
      - name: Require a clean tree on a named branch
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "tree is dirty"; exit 1; }
          echo "branch: $(git branch --show-current)"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU torch explicitly: the default resolution pulls a CUDA build with
      # several GB of nvidia-* wheels that this runner has no use for.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'
          pip install --upgrade tira

      # tira-cli runs pytest as a submission gate, and two of the framework
      # tests execute the judge for real, so the weights must be present here
      # too. The same two the image bakes.
      - name: Cache encoder weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-submit-v2

      - name: Fetch encoder weights
        env:
          HF_HOME: ${{ github.workspace }}/.hf
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo in ("BAAI/bge-base-en-v1.5",
                       "cross-encoder/nli-deberta-v3-base"):
              print("fetching", repo, flush=True)
              snapshot_download(repo)
          PY

      # tira-cli runs the suite itself as a submission gate, so a red suite here
      # blocks the submission anyway. Running it first makes the failure obvious.
      - name: Tests
        env:
          HF_HOME: ${{ github.workspace }}/.hf
        run: python -m pytest tests -q

      - name: Log in to TIRA
        run: tira-cli login --token "${{ secrets.TIRA_TOKEN }}"

      # Diagnostic, not a gate, so it must not block the submission. It builds a
      # throwaway test image and pushes it to registry.webis.de, authenticating
      # through git.webis.de, and that round trip has timed out from a GitHub
      # runner. The real code-submission step below is the thing that has to work.
      - name: Verify installation
        continue-on-error: true
        run: tira-cli verify-installation --task trec-auto-judge --team "${{ vars.TIRA_TEAM }}"

      - name: Code submission
        # tira-cli refuses to forward a variable that is unset where it runs
        # ("Some environment variables are missing and can not be forwarded"),
        # because the dry run and the pre-upload check both execute the container
        # and pass real values in. A real submission records only the names, and
        # the organizers inject their own values on TIRA.
        #
        # So these are placeholders for the local test only. The runner has no
        # model to reach, and that test runs without network anyway, so the
        # endpoint is a closed port, which NuggetRecall handles by falling back.
        # The model name is the organizers' exact id, so a warm prompt cache built
        # under that name would replay here if one is ever mounted.
        env:
          OPENAI_BASE_URL: http://127.0.0.1:9/v1
          OPENAI_MODEL: Qwen/Qwen2.5-7B-Instruct
          OPENAI_API_KEY: EMPTY
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # kiddie is small and ships in the repo, so the local test is quick.
            EXTRA=(--dry-run --dataset kiddie-20260605-training)
          fi
          # An LLM judge needs two more things, and the first is not optional.
          #
          # --forward-environment-variable registers the variable NAMES the judge
          # needs. The howto is explicit that a submission made without it "can
          # never receive an LLM endpoint", and that the only fix is to resubmit.
          # Without it the organizers could not inject their model, and the judge
          # would run on TIRA with no LLM and write an all-zero leaderboard,
          # silently. No values are sent, only the names.
          #
          # --cache-behaviour deterministic with an empty mounted cache makes TIRA
          # re-execute from the cache with the endpoint disabled and check the
          # output is identical, which is the reproducibility proof for LLM judges.
          #
          # Corroborate declares uses_llm: false and makes no LLM calls, so it
          # needs neither.
          LLM=()
          if grep -qE "^uses_llm:[[:space:]]*true" "judges/${{ inputs.judge }}/workflow.yml"; then
            LLM=(--forward-environment-variable OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL
                 --cache-behaviour deterministic --mount-cache '$CACHE_DIR=EMPTY_DIR')
            echo "LLM judge: forwarding the OPENAI_* names and using the deterministic cache"
          fi
          tira-cli code-submission "${EXTRA[@]}" "${LLM[@]}" \
            --path . \
            --task trec-auto-judge \
            --command 'auto-judge run --workflow /auto-judge/judges/${{ inputs.judge }}/workflow.yml --variant ${{ inputs.variant }} --rag-responses $inputDataset/runs/*/ --rag-topics $inputDataset/topics/*.jsonl --out-dir $outputDir'
