# TIRA code submission, run from CI.
#
# Why CI and not a laptop: the cluster this judge is developed on has no
# container runtime at all (no docker, no podman, no buildah) and no root, so
# rootless podman cannot be configured. A GitHub runner has Docker, so the image
# is built and submitted from here instead.
#
# Run it with dry_run: true first. That builds the image, runs it on kiddie, and
# uploads nothing. Only when that is green, run again with dry_run: false, which
# drops --dry-run so the submission is actually registered.
#
# --dataset is passed in BOTH cases, and that is not cosmetic. It names the
# dataset tira-cli runs the built image on before uploading, which it does either
# way. Omit it and tira_client.submit_code walks every public dataset in the task
# and keeps the LAST one that has a format and input mirrors, with no break
# (tira_client.py, "if dataset_id is None"). For trec-auto-judge that pool
# includes the pilots, which are tens of runs over about a hundred long reports.
# Running the image on one of those, on a 2-vCPU runner with the CPU-only torch
# this Dockerfile pins, would blow the job timeout and register nothing. Worse,
# the one command that has to work on the deadline would be the one command never
# rehearsed, because dry_run: true takes the other branch.
#
# TIRA grades a code submission by re-running the image itself, on its own
# hardware, over whatever datasets it chooses. Nothing here controls that.
name: TIRA code submission

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test locally, upload nothing"
        type: boolean
        default: true
      judge:
        description: "Judge directory under judges/"
        type: string
        default: "corroborate"
      variant:
        description: "workflow.yml variant to submit"
        type: string
        default: "best"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The image carries about 3 GB of encoder weights on top of the base
      # image, which does not fit beside the runner's preinstalled toolchains.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tira reads git metadata for provenance

      # tira-cli submits the committed state of the current branch and refuses a
      # dirty tree, so fail early and loudly rather than submitting a surprise.
      - name: Require a clean tree on a named branch
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "tree is dirty"; exit 1; }
          echo "branch: $(git branch --show-current)"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU torch explicitly: the default resolution pulls a CUDA build with
      # several GB of nvidia-* wheels that this runner has no use for.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'
          pip install --upgrade tira

      # tira-cli runs pytest as a submission gate, and two of the framework
      # tests execute the judge for real, so the weights must be present here
      # too. The same two the image bakes.
      - name: Cache encoder weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-submit-v2

      - name: Fetch encoder weights
        env:
          HF_HOME: ${{ github.workspace }}/.hf
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo in ("BAAI/bge-base-en-v1.5",
                       "cross-encoder/nli-deberta-v3-base"):
              print("fetching", repo, flush=True)
              snapshot_download(repo)
          PY

      # tira-cli runs the suite itself as a submission gate, so a red suite here
      # blocks the submission anyway. Running it first makes the failure obvious.
      - name: Tests
        env:
          HF_HOME: ${{ github.workspace }}/.hf
        run: python -m pytest tests -q

      - name: Log in to TIRA
        run: tira-cli login --token "${{ secrets.TIRA_TOKEN }}"

      # Diagnostic, not a gate, so it must not block the submission. It builds a
      # throwaway test image and pushes it to registry.webis.de, authenticating
      # through git.webis.de, and that round trip has timed out from a GitHub
      # runner. The real code-submission step below is the thing that has to work.
      - name: Verify installation
        continue-on-error: true
        run: tira-cli verify-installation --task trec-auto-judge --team "${{ vars.TIRA_TEAM }}"

      # Warm a prompt cache on the runner, then mount it into the container.
      #
      # This step exists because the rehearsal used to prove almost nothing. The
      # endpoint was a closed port, so inside the container every call failed,
      # NuggetRecall fell back, and the pre-upload test wrote an all-zero
      # leaderboard. TIRA accepted it: its format check only looks at the shape of
      # the file and never asks whether a measure varies between systems. The
      # deterministic-cache proof passed too, because the first run cached nothing
      # and the replay reproduced that nothing exactly. So a green run told us the
      # image builds and boots, and nothing whatever about the judging path.
      #
      # We first tried giving the container a stub endpoint on the runner, reached
      # over the docker bridge. It could not connect, and chasing container-to-host
      # routing on a hosted runner is not worth it, because a warm cache tests more
      # anyway. TIRA's own sandbox has no internet either, so serving from cache is
      # the mode that actually matters.
      #
      # So: run the judge here, on the runner, against a local stub. That warms
      # $CACHE_DIR with real parseable replies. Mount that cache into the container
      # and the container needs no network at all. What this proves is stronger
      # than reachability. minima-llm's cache key is the model plus the exact
      # messages, so the container only gets hits if its prompts are byte-identical
      # to the ones built out here. That is exactly the property TIRA's determinism
      # check depends on, and nothing else we run tests it.
      - name: Warm a prompt cache against a stub endpoint
        if: ${{ inputs.judge == 'nuggetrecall' }}
        env:
          OPENAI_BASE_URL: http://127.0.0.1:8000/v1
          OPENAI_MODEL: Qwen/Qwen2.5-7B-Instruct
          OPENAI_API_KEY: EMPTY
          HF_HOME: ${{ github.workspace }}/.hf
        run: |
          set -euo pipefail
          python3 scripts/stub_openai.py --host 127.0.0.1 --port 8000 \
            > stub-openai.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/v1/models >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/v1/models | head -c 120; echo

          export CACHE_DIR="${{ github.workspace }}/ci-cache"
          mkdir -p "$CACHE_DIR"
          auto-judge run \
            --workflow judges/${{ inputs.judge }}/workflow.yml \
            --variant ${{ inputs.variant }} \
            --rag-responses data/kiddie/runs/repgen/ \
            --rag-topics data/kiddie/topics/kiddie-topics.jsonl \
            --out-dir ./ci-warm
          # If this fails, the judge is broken here, before any container is
          # involved, which is a much easier failure to read.
          # auto-judge run writes straight into --out-dir, with no subdirectory.
          python scripts/check_upload_dir.py ./ci-warm
          ls -l "$CACHE_DIR"
          echo "CI_CACHE=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: Code submission
        # tira-cli refuses to forward a variable that is unset where it runs
        # ("Some environment variables are missing and can not be forwarded"),
        # because the dry run and the pre-upload check both execute the container
        # and pass real values in. A real submission records only the names, and
        # the organizers inject their own values on TIRA.
        #
        # These values are for the local test only, and are never stored. The
        # model id is the organizers' exact one, so the cache this run writes is
        # keyed the way theirs would be.
        env:
          OPENAI_MODEL: Qwen/Qwen2.5-7B-Instruct
          OPENAI_API_KEY: EMPTY
        run: |
          set -euo pipefail
          # kiddie is small and ships in the repo, so the pre-upload test is
          # quick. It is passed on a real submission too: see the header. Leaving
          # it off lets tira-cli pick an arbitrary large pilot set instead.
          EXTRA=(--dataset kiddie-20260605-training)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          # An LLM judge needs two more things, and the first is not optional.
          #
          # --forward-environment-variable registers the variable NAMES the judge
          # needs. The howto is explicit that a submission made without it "can
          # never receive an LLM endpoint", and that the only fix is to resubmit.
          # Without it the organizers could not inject their model, and the judge
          # would run on TIRA with no LLM and write an all-zero leaderboard,
          # silently. No values are sent, only the names.
          #
          # --cache-behaviour deterministic with an empty mounted cache makes TIRA
          # re-execute from the cache with the endpoint disabled and check the
          # output is identical, which is the reproducibility proof for LLM judges.
          #
          # Corroborate declares uses_llm: false and makes no LLM calls, so it
          # needs neither.
          #
          # --allow-network lets the pre-upload run reach the stub above. Without
          # it the container is isolated, every call fails, and the whole test
          # degenerates to the all-zero case described on the stub step.
          LLM=()
          if grep -qE "^uses_llm:[[:space:]]*true" "judges/${{ inputs.judge }}/workflow.yml"; then
            # The endpoint is deliberately unreachable. Every judgment must come
            # from the mounted cache, which is the point: it is the same mode TIRA
            # replays in, and it fails loudly if the container's prompts differ
            # from the ones that warmed the cache.
            export OPENAI_BASE_URL="EMPTY"
            LLM=(--forward-environment-variable OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL
                 --cache-behaviour deterministic
                 --mount-cache "\$CACHE_DIR=${CI_CACHE}")
            echo "LLM judge: serving from the warmed cache at ${CI_CACHE}"
          fi
          tira-cli code-submission "${EXTRA[@]}" "${LLM[@]}" \
            --path . \
            --task trec-auto-judge \
            --command 'auto-judge run --workflow /auto-judge/judges/${{ inputs.judge }}/workflow.yml --variant ${{ inputs.variant }} --rag-responses $inputDataset/runs/*/ --rag-topics $inputDataset/topics/*.jsonl --out-dir $outputDir' \
            2>&1 | tee tira-submission.log

      # The step above passes on an all-zero leaderboard, because TIRA's format
      # check never asks whether a measure varies between systems. That is exactly
      # the failure we shipped once already, so check it here. tira-cli prints the
      # directory it left the container's output in.
      - name: The container's output must actually rank systems
        run: |
          set -euo pipefail
          OUT=$(grep -oE '/tmp/tira-[A-Za-z0-9]+/output' tira-submission.log | tail -1 || true)
          if [ -z "$OUT" ] || [ ! -d "$OUT" ]; then
            # A real submission has already been registered by this point, so
            # failing here could not undo it and would only be noise. The dry run
            # exercises the same code path and is where this must catch things.
            echo "::warning::no container output directory in the log, nothing checked"
            exit 0
          fi
          echo "checking $OUT"
          python scripts/check_upload_dir.py "$OUT"

      - name: Stub endpoint log
        if: ${{ always() && inputs.judge == 'nuggetrecall' }}
        run: tail -20 stub-openai.log || true
