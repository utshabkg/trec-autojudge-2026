# Corroborate: pooled-corroboration AutoJudge with leave-one-team-out weighting.
#
# One class serves both phases. Declaring only judge_class means the runner
# reuses the same instance for the nugget phase, so the pooled clustering is
# computed once instead of twice.
judge_class: "judges.corroborate.judge:CorroborateJudge"

# ---------------------------------------------------------------- lifecycle
create_nuggets: true      # the mined bank is a deliverable in its own right
create_qrels: false       # MUST stay false: a qrels file in the output directory
                          # also parses as four whitespace-separated columns, so
                          # tira-cli cannot tell which file is the leaderboard
                          # and the upload fails its format check.
judge: true

nugget_depends_on_responses: true   # the bank is mined from the pool of answers
judge_uses_nuggets: false           # judge() rebuilds the pools deterministically
judge_uses_qrels: false
qrels_uses_nuggets: false

force_recreate_nuggets: false       # resume: reuse <filebase>.nuggets.jsonl
augment_report: false

# ----------------------------------------------------------------- settings
settings:
  filebase: "{_name}"
  # Local convenience only. Applied with setdefault, so a container that sets
  # HF_HOME itself keeps its own baked-in model path.
  hf_home: "/media/20TB/shared-cache/huggingface"
  bi_encoder: "BAAI/bge-base-en-v1.5"
  # 64, not 256: these GPUs are shared and a batch of 256 through bge-base
  # allocated 1.3 GiB in a single activation, which OOM'd against another
  # user's job. The encoder halves the batch and finally falls back to CPU on
  # OOM, so this is about avoiding the retry rather than depending on it.
  embed_batch_size: 64
  min_sentence_words: 5
  # tau=0.80 rather than a higher value: on kiddie the count of clusters
  # corroborated by two or more teams peaks near 0.78 and collapses above 0.85,
  # because BGE similarity for genuine paraphrases sits around 0.83. The tau-sweep
  # below can test other values. We did not run it on the pilots.
  tau: 0.80
  # Measured against the shipped encoder, not guessed. cos(sentence, topic) under
  # BAAI/bge-base-en-v1.5 runs 0.587-0.753 for specific facts, 0.361-0.472 for
  # boilerplate hedges and 0.266-0.319 for literal gibberish. The old 0.15, and
  # every value in the old sweep, sat below all of that, so the gate kept 100% of
  # clusters on every dataset and the sweep could not tell: all four values gave
  # identical banks. 0.50 is the gap between hedges and facts. The gate-sweep below
  # spans the live range. We did not run it on the pilots.
  specificity_floor: 0.50
  min_teams: 2              # >= 2 guarantees no bank cluster is one team's private
                            # invention, so a LOTO weight can never reach zero
  max_clusters: 40
  vote_unit: "team"         # never "run": 83 runs come from only 25 teams
  # Thread cap. Uncapped, OpenBLAS takes 64 threads and torch 60 on this
  # 120-core box, and the clustering issues very many small matrix products, so
  # nearly all the time went into launching parallel regions. Load average hit
  # 123 and the machine became unusable for its owner.
  num_threads: 8
  # Clustering block size. Similarities are computed one block at a time rather
  # than one sentence at a time. Provably identical output, see
  # test_batched_clustering_matches_sequential.
  block_size: 512

nugget_settings: {}

judge_settings:
  cross_encoder: "cross-encoder/nli-deberta-v3-base"
  use_cross_encoder: true
  cross_batch_size: 32
  cross_max_length: 512
  band_low: 0.62            # below this, a near-match is not worth a model call
  # 1, not 2: "corroborated by at least one other team" matches min_teams=2 for
  # the bank. Requiring two other teams needs 3+ teams per cluster, which on a
  # small pool zeroes NPREC for every run and silently takes NF1 and NF1_RANK
  # down with it.
  min_other_teams: 1
  attribution_mode: "auto"  # auto | inline | pool
  doc_chunk_chars: 1200
  max_doc_chunks: 6
  on_missing_evals: "fix_aggregate"

# ----------------------------------------------------------------- variants
variants:
  # The submitted configuration.
  best: {}

  # Ablation: does the leave-one-team-out correction change the ranking?
  no-loto:
    judge_settings:
      min_other_teams: 0

  # Ablation: per-run voting instead of per-team. Quantifies herd size.
  run-votes:
    settings:
      vote_unit: "run"

  # Ablation: is corroboration precision contributing beyond coverage?
  coverage-only:
    judge_settings:
      min_other_teams: 0
      attribution_mode: "pool"

  # Ablation and CPU fallback: pure embedding similarity, no band adjudication.
  no-cross-encoder:
    judge_settings:
      use_cross_encoder: false

  # NOT USED FOR SUBMISSION. Kept as a documented fallback. It was written for
  # multilingual NeuCLIR documents, but both 2026 releases turned out to be English,
  # so the English NLI model is correct and this reranker is not baked into the
  # container image. Running this variant inside the container therefore needs the
  # model mounted: tira-cli code-submission --mount-hf-model BAAI/bge-reranker-v2-m3
  multilingual:
    judge_settings:
      multilingual_cross_encoder: "BAAI/bge-reranker-v2-m3"
      cross_batch_size: 32

  # Faster configuration for a CPU-only worker. Not validated against truth.
  fast:
    settings:
      max_clusters: 25
      embed_batch_size: 64
    judge_settings:
      use_cross_encoder: false
      max_doc_chunks: 2

# ------------------------------------------------------------------- sweeps
sweeps:
  tau-sweep:
    settings:
      tau: [0.72, 0.76, 0.80, 0.84, 0.88]
  gate-sweep:
    settings:
      specificity_floor: [0.35, 0.45, 0.50, 0.55, 0.60]
    judge_settings:
      min_other_teams: [1, 2, 3]

# This judge makes no LLM calls (the endpoint-contract test xfails it).
uses_llm: false
